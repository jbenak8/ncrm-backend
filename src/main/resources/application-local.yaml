# Local testing profile: HTTP Basic with in-memory users (owner / rep / customer, password "test"),
# local PostgreSQL and a local SMTP catcher (e.g. MailHog on port 1025). No Keycloak needed.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        from:
          address: ${MAIL_FROM_ADDRESS}
          name: ${MAIL_FROM_NAME}
        auth: ${MAIL_SMTP_AUTH:false}
        starttls:
          enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
    test-connection: ${MAIL_TEST_CONNECTION:false}

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    cz.jbenak.ncrm_backend: DEBUG

ncrm:
  security:
    local-users:
      # Password for the in-memory test users (owner / rep / customer); local testing only.
      password: ${LOCAL_USER_PASSWORD}
